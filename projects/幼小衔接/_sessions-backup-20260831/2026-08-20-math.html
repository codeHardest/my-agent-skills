<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奥特曼识字战</title>
<style>
  :root {
    --bg:#FFF9F0;                       /* 页面底色 */
    --accent:#FF9800;                   /* 主色：按钮/选项/能量条 */
    --accent-light:#FFB84D;             /* 主色浅一号：渐变/发光 */
    --accent-dark:#E07000;              /* 主色深一号：logo/标题强调 */
    --accent-text:#7A3E00;              /* 主色上的深色文字 */
    --accent-soft:#FFF3DC;              /* 主色浅底：pill/徽章/卡片 */
    --accent-border:rgba(255,170,50,.4);/* 主色描边 */
    --card-shadow:rgba(200,150,70,.16);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:"YouYuan","幼圆","Microsoft YaHei","PingFang SC",sans-serif;
    background:var(--bg);
    color:#4A4A4A; overflow:hidden; user-select:none;
  }

  /* HUD 顶栏 */
  #hud { position:fixed; top:0; left:0; right:0; z-index:20; display:flex; align-items:center;
         gap:10px; padding:12px 16px; background:rgba(255,255,255,.72); backdrop-filter:blur(6px);
         border-bottom:2px solid var(--accent-border); }
  .hud-logo { font-size:24px; font-weight:900; color:var(--accent-dark); letter-spacing:1px; white-space:nowrap;
              text-shadow:0 1px 0 #fff; }
  .hud-right { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .pill { background:#fff; border:2px solid var(--accent-border); border-radius:999px;
          padding:5px 13px; font-size:14px; font-weight:800; color:var(--accent-dark); }
  .pill.warn { color:#1E7BC4; border-color:rgba(46,130,205,.5); }
  .energy-wrap { width:130px; height:16px; background:var(--accent-soft); border-radius:999px; overflow:hidden;
                 border:2px solid var(--accent-border); }
  #energyBar { height:100%; width:100%; transform:scaleX(0); transform-origin:left; background:linear-gradient(90deg,var(--accent-light),var(--accent)); border-radius:999px; transition:transform .3s; }

  /* 主屏 */
  #screen { position:relative; z-index:10; height:100%; overflow-y:auto; display:flex; flex-direction:column; align-items:center;
            justify-content:center; padding:84px 16px 28px; }
  .card { background:#fff; border-radius:32px; padding:34px 28px; max-width:520px; width:100%; text-align:center;
          box-shadow:inset 0 2px 0 rgba(255,255,255,.9), 0 16px 44px var(--card-shadow); }
  .hidden { display:none !important; }

  h1 { font-size:38px; letter-spacing:2px; margin-bottom:10px; color:#3F3F3F; line-height:1.3; }
  h1 .u { color:#1E88E5; } h1 .m { color:#FF5252; }
  .sub { color:#6E6E6E; margin-bottom:14px; font-size:17px; }
  /* 章节主角徽章（软圆贴纸） */
  .section-emoji { width:118px; height:118px; margin:14px auto 6px; border-radius:50%;
    background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center; font-size:64px;
    box-shadow:0 3px 10px var(--card-shadow); }

  .big { font-size:104px; line-height:1.2; margin:8px 0; font-weight:900; color:#3F3F3F;
         text-shadow:0 3px 0 var(--accent-light), 0 10px 26px var(--card-shadow); }
  .big.pinyin-big { color:var(--accent-dark); text-shadow:0 3px 0 rgba(255,255,255,.75); }
  .big.small { font-size:70px; }
  .pinyin { display:inline-block; background:linear-gradient(180deg,var(--accent-soft),var(--accent-light)); color:var(--accent-dark);
            border-radius:999px; padding:5px 18px; font-size:22px; font-weight:900; letter-spacing:1px; min-height:38px; }
  .prompt { font-size:21px; font-weight:700; color:#5F5F5F; margin:12px 0 18px; line-height:1.55; }
  .words-row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:8px 0 4px; }
  .word-chip { background:#EAF6FF; border:2px solid rgba(46,130,205,.4); color:#1E6791;
               border-radius:16px; padding:6px 15px; font-size:17px; font-weight:700; }
  .word-chip.speak { cursor:pointer; }
  .word-chip.speak:active { transform:scale(.94); }

  /* 选项：四色网格 */
  .options { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:10px; }
  .opt { background:var(--accent); border-radius:22px; padding:20px 10px;
         font-size:40px; font-weight:900; color:var(--accent-text); cursor:pointer;
         box-shadow:0 3px 10px var(--card-shadow);
         min-height:96px; display:flex; align-items:center; justify-content:center;
         transition:transform .08s; }
  .opt:active { transform:scale(.97); }
  .opt.correct { background:#27A75C !important; color:#fff !important; box-shadow:none !important; animation:pop .35s; }
  .opt.wrong { background:#E64A3F !important; color:#fff !important; box-shadow:none !important; animation:shake .35s; }
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.15)} 100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }

  /* 按钮 */
  .btn { background:var(--accent); color:var(--accent-text); border:none; border-radius:999px;
         padding:15px 38px; font-size:24px; font-weight:900; cursor:pointer;
         box-shadow:0 3px 10px var(--card-shadow); font-family:inherit; transition:transform .08s; }
  .btn:active { transform:scale(.97); }
  .btn.blue { background:#2E9DE8; color:#0E4A72; }

  /* 判定按钮（家长判断） */
  .judge-row { display:flex; gap:16px; justify-content:center; margin-top:16px; }
  .judge { font-size:48px; padding:18px 30px; border-radius:22px; border:none; cursor:pointer; font-weight:900; font-family:inherit;
           box-shadow:0 3px 10px rgba(0,0,0,.08); }
  .judge.ok { background:#27A75C; color:#fff; }
  .judge.no { background:#E64A3F; color:#fff; }
  .judge:active { transform:scale(.94); }

  /* 发音录音指示 */
  .mic { font-size:60px; animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.18)} }

  /* 描红画布（hanzi-writer 动画容器） */
  #traceWrap { position:relative; margin:8px auto; width:min(320px,78vw); }
  #traceWrap svg, #learnWriter svg { touch-action:none; border-radius:22px; background:var(--accent-soft);
    border:3px solid var(--accent-border); width:100%; height:auto; display:block; }
  .trace-tip { color:#6E6E6E; font-size:15px; margin-top:8px; }
  .stroke-btn { background:var(--accent); color:var(--accent-text); border:none; border-radius:999px;
    padding:12px 26px; font-size:20px; font-weight:900; cursor:pointer;
    font-family:inherit; margin-top:12px; transition:transform .08s; }
  .stroke-btn:active { transform:scale(.96); }
  #learnWriter { margin:10px auto 4px; width:min(230px,60vw); }
  #learnWriter svg { border-width:2px; border-radius:18px; }
  .writer-hint { color:var(--accent-dark); font-size:16px; font-weight:700; margin-top:6px; }

  /* 战斗动画遮罩 */
  #fx { position:fixed; inset:0; z-index:40; pointer-events:none; display:flex; align-items:center; justify-content:center; }
  .fx-monster { font-size:110px; animation:monsterFade 1s forwards; }
  @keyframes monsterFade { 0%{transform:scale(1);opacity:1} 60%{transform:scale(1.6);opacity:1} 100%{transform:scale(0);opacity:0} }
  .fx-ultra { font-size:150px; animation:ultraFlash 1.6s forwards; }
  @keyframes ultraFlash { 0%{transform:scale(.3);opacity:0} 30%{transform:scale(1.1);opacity:1} 80%{transform:scale(1.5);opacity:1} 100%{opacity:0} }

  /* 战报：K.O. 主视觉（图 + 标题叠加，标题压暗渐变保证可读） */
  #report .ko-hero { position:relative; margin:-8px -14px 12px; border-radius:22px; overflow:hidden;
    box-shadow:0 8px 22px rgba(0,0,0,.18); }
  #report .ko-img { width:100%; display:block; animation: koPunch .7s cubic-bezier(.2,1.4,.4,1); }
  #report .ko-hero h1 { position:absolute; left:0; right:0; bottom:0; margin:0; padding:46px 14px 14px;
    font-size:26px; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.45);
    background:linear-gradient(transparent, rgba(0,0,0,.55)); }
  @keyframes koPunch {
    0% { transform:scale(2.4) rotate(-6deg); opacity:0; }
    60% { transform:scale(.92) rotate(1deg); opacity:1; }
    100% { transform:scale(1) rotate(0deg); }
  }
  #report .stat-row { display:flex; justify-content:space-around; margin:14px 0; }
  .stat { background:var(--accent-soft); border-radius:20px; padding:12px 18px; min-width:92px; }
  .stat b { font-size:32px; color:var(--accent-dark); display:block; }
  .stat span { font-size:14px; color:#6E6E6E; font-weight:700; }
  .rev-list { text-align:left; max-height:180px; overflow:auto; margin:8px 0 12px; border-radius:16px; background:var(--accent-soft); padding:8px 12px; }
  .rev-list span { display:inline-block; margin:3px 5px; padding:2px 8px; border-radius:8px; font-size:15px; font-weight:700; }
  .rev-ok { background:rgba(46,204,113,.15); color:#1E9440; }
  .rev-no { background:rgba(231,76,60,.15); color:#C0392B; }

  .combo-badge { position:fixed; top:72px; right:14px; z-index:25; font-size:24px; font-weight:900; color:#FF5252;
                 text-shadow:0 2px 0 rgba(255,255,255,.8); display:none; }
  .combo-badge.show { display:block; animation:pop .3s; }

  .encourage { font-size:22px; color:var(--accent-dark); margin-top:14px; font-weight:800; min-height:32px; }
  .progress-txt { font-size:14px; color:#757575; margin-top:6px; }

  /* 触摸 + 键盘焦点（Web Interface Guidelines） */
  .btn, .opt, .judge, .word-chip { touch-action: manipulation; }
  .btn:focus-visible, .opt:focus-visible, .judge:focus-visible, .word-chip:focus-visible,
  #goBtn:focus-visible, #playBtn:focus-visible, #traceDone:focus-visible,
  #learnOk:focus-visible, #speakBtn:focus-visible, #saveBtn:focus-visible,
  #jOk:focus-visible, #jNo:focus-visible {
    outline: 3px solid #4FB6FF; outline-offset: 3px;
  }
  /* 窄屏（手机）紧凑化 */
  @media (max-width:420px) {
    .big { font-size:88px; }
    .opt { font-size:34px; min-height:84px; padding:16px 8px; }
    .card { padding:26px 18px; }
    .energy-wrap { display:none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>

<script>
"use strict";
/* ============ 数据加载 ============ */
const DATA = JSON.parse(document.getElementById('lesson-data').textContent || '{}');
const THEME = DATA.theme || {};
const $ = id => document.getElementById(id);
const screen = $('screen');

/* ============ 主题应用（CSS 变量 + 文案） ============ */
(function applyTheme(){
  const t = THEME, s = document.documentElement.style;
  if (t.accent)       s.setProperty('--accent', t.accent);
  if (t.accentLight)  s.setProperty('--accent-light', t.accentLight);
  if (t.accentDark)   s.setProperty('--accent-dark', t.accentDark);
  if (t.accentText)   s.setProperty('--accent-text', t.accentText);
  if (t.accentSoft)   s.setProperty('--accent-soft', t.accentSoft);
  if (t.accentBorder) s.setProperty('--accent-border', t.accentBorder);
  if (t.bg)           s.setProperty('--bg', t.bg);
  if (t.logo)  { const el = $('hudLogo'); if (el) el.textContent = t.logo; }
  if (t.title) document.title = t.title;
})();

/* ============ 小工具 ============ */
function rand(n){ return Math.floor(Math.random()*n); }
const ENCOURAGE = THEME.encourage || [
  "太棒了！", "好厉害！", "又消灭一只！", "奥特曼为你点赞！", "记牢啦！",
  "真聪明！", "继续加油！", "这一题漂亮！", "超厉害的！", "离胜利又近一步！"
];
const ENC_BAD = THEME.encBad || ["没关系，再想想！", "怪兽在偷笑，打败它！", "不着急，记住它！", "下一只一定行！"];

/* ============ 音效（Web Audio 合成） ============ */
let AC = null;
function audio(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function tone(freq, dur=0.15, type='sine', vol=0.5, when=0){
  const c = audio(), t = c.currentTime + when;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur);
}
function sndCorrect(){ tone(660,0.1,'square',0.4); tone(880,0.15,'square',0.4,0.08); }
function sndWrong(){ tone(180,0.25,'sawtooth',0.3); }
function sndVictory(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.2,'triangle',0.44,i*0.12)); }
function sndPower(){ tone(392,0.1,'square',0.4); tone(523,0.1,'square',0.4,0.08); tone(784,0.2,'square',0.44,0.16); }
function sndClick(){ tone(500,0.06,'square',0.2); }

/* ============ TTS 语音（语言由 DATA.lang 驱动） ============ */
let voices = [];
function loadVoices(){ voices = speechSynthesis.getVoices(); }
if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text, lang){
  if(!('speechSynthesis' in window)) return;
  if (!voices.length) voices = speechSynthesis.getVoices();  // onvoiceschanged 可能不触发，播放前兜底重载
  lang = lang || THEME.lang || 'zh-CN';
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.volume = 1; u.rate = 0.85; u.pitch = 1.05;   // volume 上限即 100%，置顶
    // 按语言前缀选音色：zh 优先 cn 排除 tw/hk；en 优先 us/gb
    const prefix = lang.toLowerCase().startsWith('zh') ? 'zh' : lang.toLowerCase().slice(0,2);
    const vs = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(prefix));
    let v = null;
    if (prefix === 'zh') {
      v = vs.find(v => v.lang.toLowerCase().includes('cn') && !v.lang.toLowerCase().includes('tw') && !v.lang.toLowerCase().includes('hk'))
       || vs.find(v => !v.lang.toLowerCase().includes('tw') && !v.lang.toLowerCase().includes('hk'))
       || vs[0];
    } else {
      v = vs.find(v => v.lang.toLowerCase().includes('us'))
       || vs.find(v => v.lang.toLowerCase().includes('gb'))
       || vs[0];
    }
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch(e) { /* 无语音引擎时静默降级 */ }
}

/* ============ 语音识别（自动判定 + 降级家长判断） ============ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function recognize(target, onResult, onFallback){
  if (!SR) return onFallback('unsupported');
  let rec;
  try {
    rec = new SR();
    rec.lang = THEME.lang || 'zh-CN'; rec.interimResults = false; rec.maxAlternatives = 5; rec.continuous = false;
  } catch(e){ return onFallback('init-fail'); }
  let done = false;
  const finish = (ok) => { if(!done){ done = true; onResult(ok); } };
  rec.onresult = ev => {
    let best = '';
    for (let i=0;i<ev.results.length;i++) best += ev.results[i][0].transcript;
    const isZh = (THEME.lang || 'zh-CN').toLowerCase().startsWith('zh');
    const norm = s => s.replace(/\s+/g,'').replace(/[^\w一-龥]/g,'').toLowerCase();
    const t = norm(target);
    if (isZh) {
      // 中文宽松判定：识别结果命中目标任意一个字
      const hit = [...t].some(ch => norm(best).includes(ch));
      finish(hit);
    } else {
      // 英语宽松判定：归一化后互相包含
      finish(norm(best).includes(t) || t.includes(norm(best)));
    }
  };
  rec.onerror = () => finish(false);
  rec.onend = () => finish(false);   // 静默结束也结束流程
  try { rec.start(); } catch(e){ finish(false); }
  // 8 秒无结果 → 自动降级家长判断
  setTimeout(() => { if(!done){ done = true; onFallback('timeout'); } }, 8000);
  return rec;
}

/* ============ 游戏状态 ============ */
let steps = (DATA.steps||[]).filter(Boolean);
let idx = -1;
let combo = 0, comboMax = 0, energy = 0, stars = 0;
let correctCount = 0, totalAnswered = 0;
let reviewResults = [];      // {id, correct, tries}
let newLearned = [];

/* 记录复习结果（聚合键：step.id || step.char，语文/英语通用）。
   choice 题附带题干明细（数学错题队列需要知道错的是哪道题） */
function recordReview(step, correct, tries){
  const key = step.id || step.char;
  if (!key || step.phase === 'new') return;
  const prev = reviewResults.find(r => r.id === key);
  if (prev) { prev.correct = prev.correct && correct; prev.tries += tries; }
  else reviewResults.push({
    id: key, correct, tries,
    step: step.kind === 'choice' ? { big: step.big, prompt: step.prompt, options: step.options, answer: step.answer } : null
  });
}

/* ============ 渲染 ============ */
/* 切换到有语音的卡片时自动朗读一次。
   pick_pinyin 除外：字形→选拼音，自动读出声等于泄露答案。 */
function autoSpeak(s){
  if (s.kind === 'section') return;
  if (s.kind === 'choice') {
    if (s.mode === 'pick_pinyin') return;
    speak(s.char || s.phonetic);
    return;
  }
  if (s.kind === 'learn') {
    speak(s.speak || (s.char ? s.char + '。' + (s.words||[]).join('，') : (s.big || s.title || '')));
    return;
  }
  if (s.kind === 'pronounce')  { speak(s.text || s.char || s.big); return; }
  if (s.kind === 'trace')      { speak(s.char || ''); return; }
}
function render(){
  if (idx >= steps.length) return finish();
  const s = steps[idx];
  writerCleanup();   // 上一步的 hanzi-writer 动画先销毁，避免泄漏/重叠
  sndClick();
  autoSpeak(s);
  switch (s.kind) {
    case 'section': return renderSection(s);
    case 'choice':  return renderChoice(s);
    case 'pronounce': return renderPronounce(s);
    case 'trace':  return renderTrace(s);
    case 'learn':  return renderLearn(s);
    default: idx++; render();
  }
}

function renderSection(s){
  updateHud();
  screen.innerHTML = `
    <div class="card">
      <h1>${s.label || ''}</h1>
      <div class="sub">${s.subtitle || ''}</div>
      ${s.emoji ? `<div class="section-emoji">${s.emoji}</div>` : ''}
      <button class="btn" id="goBtn">${s.emoji ? '出发！' : '继续'}</button>
    </div>`;
  $('goBtn').onclick = () => { next(); };
}

function renderChoice(s){
  updateHud();
  const optsHtml = s.options.map((o,i) => `<button class="opt" data-i="${i}">${o}</button>`).join('');
  screen.innerHTML = `
    <div class="card">
      ${s.big_tag ? `<div class="pinyin">${s.big_tag}</div>` : ''}
      <div class="big ${s.big_tag ? 'small' : ''}${s.mode === 'pick_char' || s.mode === 'pick_word' ? ' pinyin-big' : ''}">${s.big || ''}</div>
      <div class="prompt">${s.prompt || '选出正确的答案'}</div>
      <div class="options">${optsHtml}</div>
      <div class="encourage" aria-live="polite"></div>
    </div>`;
  // 组词点读
  screen.querySelectorAll('.word-chip').forEach(el => el.onclick = () => speak(el.dataset.w));
  // big/标签可点听（pick_pinyin 的 big 是字形，点了会读答案，排除；其余模式只要带 phonetic 即可点）
  // 朗读用文本而非拼音文本——中文 TTS 读汉字才是标准发音，读 "quán" 会拼读得怪；英语读单词正常
  if (s.phonetic && s.mode !== 'pick_pinyin') {
    screen.querySelectorAll('.big, .pinyin').forEach(el => {
      if (!el) return;
      el.style.cursor = 'pointer';
      el.onclick = () => speak(s.char || s.phonetic);
    });
  }
  let answered = false;
  screen.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => {
      if (answered) return;
      answered = true;
      const i = +btn.dataset.i, ok = (i === s.answer);
      if (ok) {
        btn.classList.add('correct');
        onCorrect(s);
      } else {
        btn.classList.add('wrong');
        screen.querySelectorAll('.opt').forEach(b => { if (+b.dataset.i === s.answer) b.classList.add('correct'); });
        onWrong(s);
      }
    };
  });
}

function renderPronounce(s){
  updateHud();
  const target = s.text || s.char || s.big || '';
  screen.innerHTML = `
    <div class="card">
      <div class="pinyin">${s.phonetic || ''}</div>
      <div class="big ${s.emoji ? 'small' : ''}">${s.emoji ? s.emoji + ' ' : ''}${s.char || target}</div>
      <div class="prompt">${s.prompt || '听一听，跟着读出来吧！'}</div>
      <button class="btn blue" id="playBtn">🔊 听发音</button>
      <div class="mic hidden" id="micIcon">🎤</div>
      <div class="judge-row hidden" id="judgeRow">
        <button class="judge ok" id="jOk">👍 标准</button>
        <button class="judge no" id="jNo">👎 再练练</button>
      </div>
      <div class="encourage" id="pronMsg" aria-live="polite">点「听发音」，跟着大声读</div>
    </div>`;
  let settled = false;
  const done = ok => {
    if (settled) return; settled = true;
    if (ok) { sndCorrect(); onCorrect(s); } else { sndWrong(); onWrong(s); }
  };
  const showJudges = () => {
    $('judgeRow').classList.remove('hidden');
    $('micIcon').classList.add('hidden');
    $('pronMsg').textContent = '家长请判断：读得标准吗？';
  };
  // 语音识别命中 → 自动判定；未命中或失败 → 家长判断
  const autoJudge = ok => {
    if (ok) { $('pronMsg').textContent = '👏 识别成功！真标准！'; return done(true); }
    $('micIcon').classList.add('hidden');
    showJudges();
  };
  $('playBtn').onclick = () => {
    speak(target);
    $('micIcon').classList.remove('hidden');
    $('judgeRow').classList.add('hidden');
    $('pronMsg').textContent = '🎤 正在听…请大声跟读（可再点播放重听）';
    recognize(target, autoJudge, showJudges);
  };
  $('jOk').onclick = () => done(true);
  $('jNo').onclick = () => done(false);
}

/* 描红练习 */
/* 当前 hanzi-writer 实例（每步切换时销毁，防泄漏/重叠） */
let currentWriter = null;
function writerCleanup(){
  if (currentWriter){ try{ currentWriter.destroy(); }catch(e){} currentWriter = null; }
}
/* 从本地打包数据取笔顺数据（未内置时降级到引擎默认 CDN 加载器） */
function charDataLoader(char, onComplete, onError){
  const d = window.STROKE_DATA && window.STROKE_DATA[char];
  if (d){ onComplete(d); return; }
  if (HanziWriter && HanziWriter.loadCharacterData){
    HanziWriter.loadCharacterData(char).then(onComplete).catch(onError);
  } else onError('no-data');
}

/* 描红练习：先看笔顺演示，再按正确笔顺逐笔书写，全部写对才过关（严格模式，无跳过） */
function renderTrace(s){
  updateHud();
  screen.innerHTML = `
    <div class="card">
      <div class="pinyin">${s.phonetic || ''}</div>
      <div class="prompt">${s.prompt || '跟着笔顺写一写'}</div>
      <div id="traceWrap"></div>
      <div class="trace-tip writer-hint" id="traceHint">👀 先看看这个字怎么写</div>
      <button class="stroke-btn" id="traceGo">开始写！</button>
    </div>`;
  writerCleanup();
  const wrap = $('traceWrap');
  const hint = $('traceHint');
  const goBtn = $('traceGo');
  const ch = s.char || '一';

  currentWriter = HanziWriter.create(wrap, ch, {
    charDataLoader, width: 320, height: 320,
    padding: 8, showCharacter: true, showOutline: true,
    strokeColor: '#E07B00', highlightColor: '#1E88E5', outlineColor: '#B8A9D4',
    drawingColor: '#FF8A00', strokeAnimationSpeed: 0.9, delayBetweenStrokes: 500,
    onLoadCharDataError: () => { hint.textContent = '笔顺数据加载失败'; }
  });
  currentWriter.loopCharacterAnimation();

  goBtn.onclick = () => {
    if (!currentWriter) return;
    sndClick();
    goBtn.disabled = true;
    goBtn.style.opacity = '.5';
    hint.textContent = '✍️ 按笔顺写！一笔一笔来';
    // 停掉演示，进入严格逐笔校验
    currentWriter.pauseAnimation();
    currentWriter.cancelQuiz();
    currentWriter.quiz({
      quizStartStrokeNum: 0,
      showHintAfterMisses: 2,          // 连续错 2 笔后显示提示
      highlightOnComplete: true,
      acceptBackwardsStrokes: false,   // 严格：倒笔算错
      onMistake: () => { sndWrong(); hint.textContent = '💡 这一笔不对，再试一次！'; },
      onComplete: () => {
        hint.textContent = '🌟 全部写完啦！';
        sndPower();
        unlockFlash(ch);
        setTimeout(() => { writerCleanup(); next(); }, 1000);
      }
    });
  };
}

/* 学习卡：语文（汉字+笔顺动画）与英语/数学（无 char 则只展示图文）通用 */
function renderLearn(s){
  updateHud();
  const strokes = (s.strokes||[]).join(' → ');
  const big = s.big || s.char || '';
  const sub = s.subtitle || s.pinyin || '';
  const hasWriter = !!(s.char && window.STROKE_DATA && window.STROKE_DATA[s.char]);
  screen.innerHTML = `
    <div class="card">
      ${(sub || s.emoji) ? `<div class="pinyin">${s.emoji ? s.emoji + ' ' : ''}${sub}</div>` : ''}
      <div class="big ${(s.emoji && !s.char) ? 'small' : ''}">${big}</div>
      <div class="prompt">${s.prompt || '新技能解锁！记住这个字'}</div>
      ${s.detail ? `<div class="sub" style="font-size:22px;font-weight:800;color:var(--accent-dark)">${s.detail}</div>` : ''}
      ${hasWriter ? `<div id="learnWriter"></div>
      <div class="writer-hint">👇 看笔顺动画</div>
      <button class="stroke-btn" id="replayBtn">🔁 再看一遍</button>` : ''}
      ${(s.words||[]).length ? `<div class="words-row">${(s.words||[]).map(w=>`<span class="word-chip speak" data-w="${w}">🔊 ${w}</span>`).join('')}</div>` : ''}
      ${strokes ? `<div class="trace-tip">笔顺：${strokes}</div>` : ''}
      <button class="btn blue" id="speakBtn" style="margin-top:12px;">🔊 听读音</button>
      <button class="btn" id="learnOk" style="margin-top:8px;">${s.okLabel || '我会啦！'}</button>
    </div>`;
  if (hasWriter) {
    writerCleanup();
    currentWriter = HanziWriter.create($('learnWriter'), s.char, {
      charDataLoader, width: 230, height: 230,
      padding: 10, showCharacter: true, showOutline: false,
      strokeColor: '#E07B00', highlightColor: '#1E88E5',
      strokeAnimationSpeed: 0.75, delayBetweenStrokes: 550
    });
    currentWriter.loopCharacterAnimation();
    $('replayBtn').onclick = () => {
      sndClick();
      if (!currentWriter) return;
      currentWriter.pauseAnimation();
      currentWriter.loopCharacterAnimation();
    };
  }
  const speakText = s.speak || (s.char ? s.char + '。' + (s.words||[]).join('，') : big);
  $('speakBtn').onclick = () => speak(speakText);
  screen.querySelectorAll('.word-chip').forEach(el => el.onclick = () => speak(el.dataset.w));
  $('learnOk').onclick = () => {
    writerCleanup();
    newLearned.push(s.id || s.char);
    sndPower();
    unlockFlash(s.id || s.char);
    setTimeout(next, 900);
  };
}

/* ============ 战斗效果 ============ */
function fxMonster(){ const fx=$('fx'); fx.innerHTML='<div class="fx-monster">👾</div>'; setTimeout(()=>fx.innerHTML='',1000); }
function fxUltra(){ const fx=$('fx'); fx.innerHTML='<div class="fx-ultra">💥⚡💥</div>'; setTimeout(()=>fx.innerHTML='',1700); }

function onCorrect(s){
  totalAnswered++;
  combo++; comboMax = Math.max(comboMax, combo);
  energy = Math.min(100, energy + 12);
  stars += 1;
  correctCount++;
  recordReview(s, true, 1);
  if (combo >= 5) fxUltra(); else fxMonster();
  if (energy >= 100) { fxUltra(); energy = 0; }
  const el = screen.querySelector('.encourage');
  if (el) el.textContent = (combo>=3 ? `🔥 连击 ${combo}！` : '') + ENCOURAGE[rand(ENCOURAGE.length)];
  sndCorrect();
  updateHud();
  setTimeout(next, 700);
}
function onWrong(s){
  totalAnswered++;
  combo = 0; stars = Math.max(0, stars - 1);
  recordReview(s, false, 1);
  const el = screen.querySelector('.encourage');
  if (el) el.textContent = ENC_BAD[rand(ENC_BAD.length)];
  sndWrong();
  updateHud();
  setTimeout(next, 1300);
}

/* ============ 顶栏 ============ */
function updateHud(){
  const answered = reviewResults.length + newLearned.length;
  $('energyBar').style.transform = 'scaleX(' + (energy/100) + ')';
  $('hudEnergy').textContent = '⚡ ' + energy;
  $('hudStars').textContent = '⭐ ' + stars;
  $('hudProg').textContent = (THEME.progIcon || '👾') + ' ' + answered;
  const cb = $('comboBadge');
  if (combo >= 2) { cb.textContent = '🔥 x' + combo; cb.classList.add('show'); }
  else cb.classList.remove('show');
}

function next(){ idx++; render(); }

/* ============ 解锁动画 ============ */
function unlockFlash(ch){
  const fx = $('fx');
  const hero = THEME.heroEmoji || '🦸';
  const label = THEME.unlockLabel || '新技能';
  fx.innerHTML = `<div style="text-align:center"><div style="font-size:120px">${hero}</div><div style="font-size:46px;color:#ffd34d;font-weight:900">${label} · ${ch}</div></div>`;
  setTimeout(()=>fx.innerHTML='', 900);
}

/* ============ 结束 / 战报 ============ */
/* K.O. 图池：每次结算随机一张。THEME.koImage = 指定图（不随机）/ ''（不显示）/ 未设（随机） */
const KO_POOL = ['../assets/ko97.svg', '../assets/ko-alt-1.jpg', '../assets/ko-alt-2.jpg',
  '../assets/ko-alt-3.jpg', '../assets/ko-alt-4.jpg', '../assets/ko-alt-5.jpg', '../assets/ko-alt-6.png'];
function koSrc(){
  if (THEME.koImage !== undefined) return THEME.koImage;
  return KO_POOL[Math.floor(Math.random() * KO_POOL.length)];
}
function finish(){
  sndVictory();
  const wrong = reviewResults.filter(r => !r.correct);
  const ok = reviewResults.filter(r => r.correct);
  const totalRev = reviewResults.length;
  const pct = totalRev ? Math.round(ok.length/totalRev*100) : 0;
  const praise = pct >= 90 ? (THEME.praiseHigh || '超级厉害！奥特曼为你骄傲！')
              : pct >= 70 ? (THEME.praiseMid || '很棒！明天再来战！')
              : (THEME.praiseLow || '不错！多复习几次会更棒！');

  const result = {
    date: DATA.date || '',
    subject: DATA.subject || 'chinese',
    review: reviewResults,
    new_items: newLearned,
    stats: { stars, combo_max: comboMax, correct: correctCount, total: totalAnswered }
  };
  const filename = `result-${DATA.date||'session'}-${DATA.subject||'chinese'}.json`;
  const ko = koSrc();

  screen.innerHTML = `
    <div class="card" id="report">
      ${ko !== '' ? `
      <div class="ko-hero">
        <img class="ko-img" src="${ko}" alt="K.O.">
        <h1>${THEME.reportTitle || '🛡️ 今日战报'}</h1>
      </div>` : `<h1>${THEME.reportTitle || '🛡️ 今日战报'}</h1>`}
      <div class="sub">${praise}</div>
      <div class="stat-row">
        <div class="stat"><b>${totalRev}</b><span>复习</span></div>
        <div class="stat"><b>${newLearned.length}</b><span>${THEME.newLabel || '新字'}</span></div>
        <div class="stat"><b>${ok.length}</b><span>答对</span></div>
        <div class="stat"><b>${wrong.length}</b><span>错</span></div>
      </div>
      <div class="stat-row">
        <div class="stat"><b>⭐${stars}</b><span>星星</span></div>
        <div class="stat"><b>🔥${comboMax}</b><span>最高连击</span></div>
        <div class="stat"><b>${pct}%</b><span>正确率</span></div>
      </div>
      ${wrong.length ? `<div class="rev-list" style="color:#ff9d9d;">要再练练：${wrong.map(r=>`<span class="rev-no">${r.id || r.char}</span>`).join('')}</div>` : ''}
      ${newLearned.length ? `<div class="rev-list">${THEME.newLabel || '新技能'}：${newLearned.map(c=>`<span class="rev-ok">${c}</span>`).join('')}</div>` : ''}
      <button class="btn" id="saveBtn">💾 保存学习结果</button>
      <div class="encourage" id="saveMsg" aria-live="polite"></div>
    </div>`;

  $('saveBtn').onclick = () => saveResult(result, filename);
  // 自动尝试静默保存（第一次需用户授权选目录）
  setTimeout(() => saveResult(result, filename, true), 500);
}

/* 保存结果：File System Access API 优先（目录句柄缓存在内存，同一页面内免重复授权），下载兜底 */
async function saveResult(result, filename, silent){
  const msg = $('saveMsg'); if (msg) msg.textContent = '正在保存…';
  const json = JSON.stringify(result, null, 2);
  try {
    if (!window.showDirectoryPicker) throw new Error('fs-api-unavailable');
    let dir = window.__dirHandleCache__ || null;
    if (!dir) {
      if (silent) return;   // 静默自动保存仅在已授权时写
      dir = await window.showDirectoryPicker();
      window.__dirHandleCache__ = dir;
    }
    const fh = await dir.getFileHandle(filename, { create:true });
    const w = await fh.createWritable();
    await w.write(json); await w.close();
    if (msg) msg.textContent = '✅ 已写入 results 文件夹：' + filename;
    sndVictory();
  } catch(e) {
    if (silent) return;
    try {
      const blob = new Blob([json], { type:'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      if (msg) msg.textContent = '⬇️ 已下载 ' + filename + '，请保存到 data\\results\\ 目录';
    } catch(e2) {
      if (msg) msg.textContent = '⚠️ 请复制下方内容手动保存';
    }
  }
}

/* ============ 启动 ============ */
function start(){
  if (!steps.length){
    screen.innerHTML = `<div class="card"><h1>今日没有任务</h1><div class="sub">先运行 /kid-learn 生成今日页面</div></div>`;
    return;
  }
  next();   // 从 idx=-1 推进到 0，首屏正确渲染第一题
}
start();
</script>
